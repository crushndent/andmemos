syntax = "proto3";

package memos.store;

import "google/protobuf/timestamp.proto";

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Optional due date, used when the memo is a board card.
  google.protobuf.Timestamp due_time = 4;

  // Position of this memo as a card in each board it is tagged into, keyed by board name.
  // Lower sorts first. Maintained by drag and drop, never typed by hand.
  map<string, double> board_positions = 5;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }
}
