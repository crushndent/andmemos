<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Memos</title>
    <link rel="stylesheet" href="../styles/ui.css" />
    <style>body { width: 360px; }</style>
  </head>
  <body>
    <main>
      <h1>Save to Memos</h1>
      <div id="setup" hidden>
        <p class="hint" id="setup-message"></p>
        <button id="open-options" class="primary" type="button">Open options</button>
      </div>
      <form id="form" hidden>
        <label>Title <input id="title" autocomplete="off" /></label>
        <div class="url" id="url" title=""></div>
        <label>Note (optional) <textarea id="note" placeholder="Why are you saving this?"></textarea></label>
        <div class="row">
          <button id="save" class="primary" type="submit">Save</button>
          <span class="hint" id="meta"></span>
        </div>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
